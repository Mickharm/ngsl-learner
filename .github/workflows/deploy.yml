name: Deploy to GitHub Pages

# Pages serves the gh-pages branch ("Deploy from a branch"). This workflow
# builds main and force-pushes dist/ to that branch with the same script used
# by hand (scripts/deploy-pages.mjs), so a push to main is all a release needs.
# The earlier version uploaded a Pages *artifact*, which only works when Pages
# is set to "GitHub Actions" — with a branch source it failed on every push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish dist/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-pages.mjs
